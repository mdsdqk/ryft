    <!--
      DIRECTION CONTRACT — ryft merge review (seed ece4721e, form #5 of the grounded list)

      THESIS: A schema merge is a controlled engineering revision — reviewed, classified,
      signed off — not a pull request. Refuses the GitHub unified-diff dump and the
      commit-graph spine; ryft has no commits.

      OWN-WORLD: The drafting room. Diazo blueprint palette in light (bone ground, prussian
      = ours, burnt-orange = theirs, oxide-red = conflict), Cyanotype in dark. Bordered
      sheet, title block, numbered revision triangles, revision clouds around what diverged,
      leader-line annotations, monospace body, a condensed technical display face. Two
      provenance colours carry the whole screen: ours / theirs / conflict.

      STORY: The reviewer sees what each branch drew against the common base, walks the
      conflict queue resolving each conflict by its class, watches the revision-status dial
      advance from In check toward Cleared, and leaves with ordered Postgres DDL — or a
      stated reason the merge is held.

      FIRST VIEWPORT: Title strip, revision-status dial top-right (a dial that turns, never
      a stamp). Zone A three-way comparison fills the sheet — object + stable id in the
      gutter, "on ours" / "on theirs" columns, base stated plainly, no spine. Zones B
      (conflict queue), C (operation log), D (fabrication order / DDL) follow. Primary
      action: resolve the active conflict.

      FORM: mechanical-drafting revision sheet; #5 on the grounded list; seed key ece4721e.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
